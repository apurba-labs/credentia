services:
  credentia-api:
    build: .
    container_name: credentia-api
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - gotihub_network

  credentia-console:
    build: .
    container_name: credentia-console
    command: ["uv", "run", "python", "-m", "streamlit", "run", "src/ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    env_file:
      - .env
    expose:
      - "8501"
    depends_on:
      - credentia-api
    restart: unless-stopped
    networks:
      - gotihub_network

networks:
  gotihub_network:
    name: gotihub_global_network
    external: true