services:
  openai-credentia-api:
    build: .
    container_name: openai-credentia-api
    command:
      - uv
      - run
      - uvicorn
      - main:app
      - --host=0.0.0.0
      - --port=8000
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - gotihub_network

  openai-credentia-console:
    build: .
    container_name: openai-credentia-console
    command:
      - uv
      - run
      - python
      - -m
      - streamlit
      - run
      - src/ui/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
    env_file:
      - .env
    depends_on:
      - openai-credentia-api
    restart: unless-stopped
    expose:
      - "8501"
    networks:
      - gotihub_network

networks:
  gotihub_network:
    external: true
    name: gotihub_global_network